<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gradFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Centered & Scaled Icon Group -->
  <g transform="translate(6, 5)">
    <!-- Main W Shape -->
    <path d="M 15,22 L 35,52 L 48,32 L 61,52 L 81,22" 
          fill="none" 
          stroke="url(#gradFavicon)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Top Right Accent Dot -->
    <circle cx="81" cy="22" r="5.5" fill="#db2777" />
    
    <!-- Bottom Smile Curve -->
    <path d="M 23,72 Q 48,84 73,72" 
          fill="none" 
          stroke="url(#gradFavicon)" 
          stroke-width="5" 
          stroke-linecap="round"/>
  </g>
</svg>
