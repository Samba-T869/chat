<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fujo Chat | Users</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .users-page {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 800px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .users-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .users-header a {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            transition: all 0.3s;
        }
        .users-header a:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        .users-list {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            background: white;
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            transition: all 0.2s;
        }
        .user-item:hover {
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .user-item.current-user {
            background: #f0f0ff;
            border-color: #667eea;
        }
        .user-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .user-status.online {
            background: #2ecc71;
            box-shadow: 0 0 6px rgba(46, 204, 113, 0.5);
        }
        .user-status.offline {
            background: #e74c3c;
            opacity: 0.5;
        }
        .user-name {
            flex: 1;
            font-weight: 500;
        }
        .user-name .you-badge {
            font-size: 0.75rem;
            color: #667eea;
            font-weight: 600;
            margin-left: 5px;
        }
        .user-email {
            font-size: 0.85rem;
            color: #999;
        }
        .stats {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
        }
        .stats span {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
        }
        .no-users {
            text-align: center;
            color: #999;
            padding: 40px;
            font-style: italic;
        }
        .back-button {
            color: white !important;
            background: rgba(255,255,255,0.2) !important;
            padding: 8px 20px !important;
            border-radius: 20px !important;
            text-decoration: none !important;
            transition: all 0.3s !important;
        }
        .back-button:hover {
            background: rgba(255,255,255,0.3) !important;
        }
    </style>
</head>
<body>
    <div class="users-page">
        <div class="users-header">
            <a href="index.html" class="back-button" title="Go back">←</a>
            <div>
                <h1>👥 All Users</h1>
                <div class="stats">
                    <span id="user-count">0 Total Users</span>
                    <span id="online-count">0 Online</span>
                </div>
            </div>
        </div>
        
        <div class="users-list" id="users-list">
            <div id="users">
                <!-- Users will be displayed here -->
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Check authentication
        async function checkAuth() {
            try {
                const response = await fetch('/api/check-auth', {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (!data.authenticated) {
                    window.location.href = '/login.html';
                    return;
                }
                
                currentUsername = data.username || '';

                // Initialize socket and load users
                await loadAllRegisteredUsers();
                initializeSocket();
                
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = '/login.html';
            }
        }

        let socket = null;
        let currentUsername = '';
        let onlineUsers = [];
        let allRegisteredUsers = [];

        function initializeSocket() {
            socket = io({
                transports: ['websocket', 'polling'],
                withCredentials: true
            });

            socket.on('connect', () => {
                console.log('Socket connected for users page');
            });

            socket.on('online users', (users) => {
                onlineUsers = users;
                renderUserList();
            });

            socket.on('connect_error', (error) => {
                console.error('Socket connection error:', error);
            });
        }

        async function loadUsers() {
            try {
                // Get current user info
                const authResponse = await fetch('/api/check-auth', {
                    credentials: 'include'
                });
                const authData = await authResponse.json();
                currentUsername = authData.username || '';

                // Get online users to update status
                const onlineResponse = await fetch('/api/online-users', {
                    credentials: 'include'
                });
                
                if (onlineResponse.ok) {
                    onlineUsers = await onlineResponse.json();
                }

                // Load all registered users
                await loadAllRegisteredUsers();
            } catch (error) {
                console.error('Failed to load users:', error);
            }
        }

        async function loadAllRegisteredUsers() {
            try {
                const response = await fetch('/api/users', {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    allRegisteredUsers = await response.json();
                    renderUserList();
                }
            } catch (error) {
                console.error('Failed to load registered users:', error);
            }
        }

        function renderUserList() {
            const onlineUsernames = onlineUsers.map(u => u.username);
            
            // Map registered users with real-time online status
            const mergedList = allRegisteredUsers.map(user => ({
                username: user.username,
                email: user.email || '',
                status: onlineUsernames.includes(user.username) ? 'online' : 'offline',
                created_at: user.created_at
            }));
            
            displayUsers(mergedList);
        }

        function displayUsers(userList = []) {
            const usersDiv = document.getElementById('users');
            const userCountSpan = document.getElementById('user-count');
            const onlineCountSpan = document.getElementById('online-count');
            
            if (!usersDiv) return;

            // Update counts
            if (userCountSpan) {
                userCountSpan.textContent = `${userList.length} Total Users`;
            }

            if (onlineCountSpan) {
                const onlineCount = userList.filter(u => u.status === 'online').length;
                onlineCountSpan.textContent = `${onlineCount} Online`;
            }

            if (userList.length === 0) {
                usersDiv.innerHTML = '<div class="no-users">No users found</div>';
                return;
            }

            // Sort: online users first, then alphabetical
            const sortedUsers = [...userList].sort((a, b) => {
                if (a.status === 'online' && b.status !== 'online') return -1;
                if (a.status !== 'online' && b.status === 'online') return 1;
                return a.username.localeCompare(b.username);
            });

            let html = '';
            sortedUsers.forEach(user => {
                const isCurrentUser = user.username === currentUsername;
                html += `
                    <div class="user-item ${isCurrentUser ? 'current-user' : ''}">
                        <span class="user-status ${user.status || 'offline'}"></span>
                        <span class="user-name">
                            ${user.username}
                            ${isCurrentUser ? '<span class="you-badge">(you)</span>' : ''}
                           
                        </span>
                        <span class="user-status-text" style="font-size:0.8rem;color:#999;">
                            ${user.status || 'offline'}
                        </span>
                    </div>
                `;
            });

            //${user.email ? `<span class="user-email">(${user.email})</span>` : ''}
            usersDiv.innerHTML = html;
        }
        
        // Start the app
        checkAuth();

        // Refresh users list every 30 seconds
        setInterval(() => {
            if (socket && socket.connected) {
                fetch('/api/online-users', { credentials: 'include' })
                    .then(res => res.json())
                    .then(users => {
                        onlineUsers = users;
                        renderUserList();
                    })
                    .catch(err => console.error('Failed to refresh users:', err));
            }
        }, 30000);
    </script>
</body>
</html>
