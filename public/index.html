<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fujo Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="chat-header">
            <div>
                <h1>💬Fujo</h1>
                <div id="Online-count">0: Online</div>
                <a href="users.html">All users</a>
            </div>
            <div class="header-right">
                <span id="username-display" class="username-display"></span>
                <button id="logout-btn" class="logout-btn">Logout</button>
            </div>
        </div>
        
        <div class="chat-box" id="chat-box">
            <div id="messages"></div>
            <div id="typing-indicator"></div>
        </div>
        
        <div class="input-area">
            <div class="message-input">
                <input type="text" id="message-input" placeholder="Andika unachojiskia..." disabled>
                <button id="send-btn" disabled>Send</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
