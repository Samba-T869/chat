<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neverAlone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { margin:0; background:#131a22; color:#fff; font-family:'Inter',sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .container { text-align:center; }
        .loading-logo { font-size:52px; font-weight:700; letter-spacing:2px; }
        .loading-logo:before { content:"\f06c"; font-family:"Font Awesome 6 Free"; font-weight:900; color:#ff9900; margin-right:12px; }
        .description { margin-top:20px; font-size:18px; color:#ccc; }
        .spinner { margin-top:30px; font-size:40px; color:#ff9900; animation:spin 1s linear infinite; }
        @keyframes spin { 100%{ transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading-logo">neverAlone</div>
        <div class="description"><p>You will never be Alone!</p></div>
        <div class="spinner"><i class="fas fa-circle-notch"></i></div>
    </div>
    <script>
        // Check if user is logged in and redirect
        async function checkAndRedirect() {
            try {
                const response = await fetch('/api/check-auth', {
                    credentials: 'include'
                });
                const data = await response.json();
                if (data.authenticated) {
                    window.location.href = '/homepage.html';
                } else {
                    window.location.href = '/login.html';
                }
            } catch (error) {
                window.location.href = '/login.html';
            }
        }
        setTimeout(checkAndRedirect, 2000);
    </script>
</body>
</html>
